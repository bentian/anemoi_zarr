# Time period (inclusive). YYYYMM or YYYYMMDD.
# "201512" as the end means up to and including 2015-12-31.
period: ["20100101", "20100103"]

# Time step of the output dataset. Must be a fixed step (e.g. 1D, 6h, 24h).
frequency: 1h

# Target grid that every variable gets interpolated onto.
grid:
  # Option A: use the grid of one of the sources (index into `sources`).
  # reference: 0 # ERA5 native grid is 720x1440

  # Option B: define the grid explicitly (start, stop, step), inclusive.
  # lat: [5, 40, 0.25]
  # lon: [100, 140, 0.25]

  # Option C: crop the `reference` source grid to (start, stop), inclusive,
  #           keeping its native grid step (no step given).
  reference: 0
  lat: [5, 40]
  lon: [100, 140]

  method: linear # default regrid method: linear | nearest

sources:
  ###
  # ERA5 (PRS)
  ###
  - path: /lfs/archive/Reanalysis/ERA5/PRS/1hr/
    pattern: "[qtuvz]/2010/01/ERA5_*.nc" # glob pattern inside `path` (default "*.nc", "**/*.nc" = recursive)
    variables:
      z: [500]
      v: [850]
      u: [850]
      t: [850]
      q: [850]
    level_coord: level
    time_method: mean

  ###
  # ERA5-Land
  ###
  # - path: /lfs/archive/Reanalysis/ERA5-Land/soil/
  #   pattern: "ERA5-Land_*.nc" # glob pattern inside `path` (default "*.nc", "**/*.nc" = recursive)
  #   variables:
  #     - swvl1
  #     - swvl2
  #     - swvl3

  ###
  # Taiwan observation grid data
  ###
  # - path: /lfs/archive/TCCIP_data/grid/hr/0.05deg/temp/v1/
  #   pattern: "2010/temp.hourly-0.05deg_grid.2010010[1-3]-v1.nc" # glob pattern inside `path` (default "*.nc", "**/*.nc" = recursive)
  #   variables:
  #     - temp
  #   rename: { "temp": "tavg" }

# Optional metadata copied into the zarr attributes
description: "Anemoi Zarr for HeatSense"
licence: "unknown"
attribution: "TCCIP, ECMWF"
